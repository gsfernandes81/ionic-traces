[project]
name = "ionic"
version = "2.0"
description = ""
authors = [{ name = "GS", email = "gsfernandes81@gmail.com" }]
requires-python = "~=3.12.0"
readme = "README.md"
license = "AGPL-3.0-only"
dependencies = [
    "arrow>=1.3.0,<2",
    "hypercorn>=0.18,<0.19",
    "Jinja2>=3.1.4,<4",
    "quart>=0.20.0,<0.21",
    "regex>=2023.6.3,<2024",
    "uvloop>=0.19.0,<0.20",
    "dateparser>=1.1.3,<2",
    "sqlalchemy>=2.0.23,<3",
    "yarl>=1.9.2,<2",
    "hikari[speedups]==2.0.0.dev126",
    "hikari-lightbulb>=2.3.3,<3",
    "hikari-message",
    "attrs>=23.1.0,<24",
    "honcho>=1.1.0,<2",
    "asyncmy>=0.2.10,<0.3",
    "emoji>=2.8.0,<3",
    "werkzeug>=3.0.3,<4",
    "python-dotenv>=1.2.1,<2",
    "cryptography>=46.0.3,<47",
]

[dependency-groups]
dev = [
    "bandit>=1.7.4,<2",
    "ruff",
    "pyflakes>=2.5.0,<3",
    "rope>=1.4.0,<2",
]

[tool.uv]

[tool.uv.sources]
hikari-message = { git = "https://github.com/gsfernandes81/hikari-message.git", rev = "e0b7e5f" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
